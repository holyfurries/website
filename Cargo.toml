[package]
name = "holyfurries"
version = "0.1.1"
edition = "2024"
default-run = "holyfurries"
rust-version = "1.88"
publish = false
license = "MIT"

[dependencies]
askama = "0.15"
async-nats = "0.46"
axum = "0.8"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "signal",
  "sync",
  "time",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["compression-gzip", "set-header"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
