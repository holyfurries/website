name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
      - name: Check formatting
        run: |
          nix develop --command cargo fmt --check
          nix develop --command nixfmt --check flake.nix nix/*.nix
          nix develop --command biome format --indent-style=space --indent-width=4 static/site.css static/images.js
          nix develop --command tofu -chdir=ops fmt -check -recursive
      - name: Build and test
        run: nix flake check --print-build-logs
      - name: Test infrastructure configuration
        run: |
          nix develop --command tofu -chdir=ops init -backend=false -input=false -lockfile=readonly
          nix develop --command tofu -chdir=ops validate
          nix develop --command tofu -chdir=ops test
