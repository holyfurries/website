name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/ci.yml
  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SYSTEM: x86_64-linux
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          nix develop --command bash -euo pipefail <<'BASH'
            task_version=$(cargo metadata --locked --offline --no-deps --format-version 1 | jq -r ".packages[] | select(.name == \"holyfurries\") | .version")
            test "$RELEASE_TAG" = "v$task_version"
          BASH
      - name: Build and test
        run: nix build ".#packages.$TARGET_SYSTEM.default" --print-build-logs
      - name: Export runtime closure
        run: |
          nix shell --inputs-from . nixpkgs#gnutar nixpkgs#gzip nixpkgs#coreutils --command bash -euo pipefail <<'BASH'
            task_release_directory="$RUNNER_TEMP/release-$TARGET_SYSTEM"
            mkdir -p "$task_release_directory" dist
            readlink -f result > "$task_release_directory/store-path"
            mapfile -t task_store_paths < <(nix-store --query --requisites result)
            nix-store --export "${task_store_paths[@]}" > "$task_release_directory/closure.nar"
            cp LICENSE ASSETS.md README.md static/vendor/datastar-LICENSE.txt "$task_release_directory/"
            task_archive="holyfurries-$TARGET_SYSTEM.tar.gz"
            tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "dist/$task_archive" -C "$task_release_directory" .
            cd dist
            sha256sum "$task_archive" > "$task_archive.sha256"
          BASH
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-x86_64-linux
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_SYSTEM: x86_64-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-x86_64-linux
          path: dist
      - name: Import and run the release on a fresh runner
        run: |
          nix shell --inputs-from . nixpkgs#gnutar nixpkgs#gzip nixpkgs#coreutils nixpkgs#curl nixpkgs#gnused --command bash -euo pipefail <<'BASH'
            cd dist
            task_archive="holyfurries-$TARGET_SYSTEM.tar.gz"
            sha256sum --check "$task_archive.sha256"
            task_extract_directory="$RUNNER_TEMP/import-$TARGET_SYSTEM"
            mkdir -p "$task_extract_directory"
            tar -xzf "$task_archive" -C "$task_extract_directory"
            sudo "$(command -v nix-store)" --import < "$task_extract_directory/closure.nar"
            task_package=$(cat "$task_extract_directory/store-path")
            [[ "$task_package" =~ ^/nix/store/[a-z0-9]{32}-holyfurries-[0-9.]+$ ]]
            nix-store --verify-path "$task_package"
            test -x "$task_package/bin/holyfurries-update"
            test -s "$task_package/share/licenses/nats-server/LICENSE"
            task_pids=()
            trap 'if ((${#task_pids[@]})); then kill "${task_pids[@]}" 2>/dev/null || true; fi' EXIT
            LISTEN_ADDRESS=127.0.0.1:8080 "$task_package/bin/holyfurries" > "$RUNNER_TEMP/website.log" 2>&1 &
            task_pids+=("$!")
            curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused --max-time 2 http://127.0.0.1:8080/healthz
            curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/ --output "$RUNNER_TEMP/home.html"
            task_image_script=$(sed -n 's/.*src="\(\/static\/[a-f0-9]\{64\}\/images\.js\)".*/\1/p' "$RUNNER_TEMP/home.html")
            test -n "$task_image_script"
            curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:8080$task_image_script" --output /dev/null
          BASH
  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish verified archives
        run: |
          nix shell --inputs-from . nixpkgs#gh --command bash -euo pipefail <<'BASH'
            if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
              mkdir "$RUNNER_TEMP/published-checksums"
              gh release download "$RELEASE_TAG" --pattern '*.sha256' --dir "$RUNNER_TEMP/published-checksums"
              cmp dist/holyfurries-x86_64-linux.tar.gz.sha256 "$RUNNER_TEMP/published-checksums/holyfurries-x86_64-linux.tar.gz.sha256"
            else
              gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
            fi
          BASH
